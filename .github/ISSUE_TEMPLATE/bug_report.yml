name: Bug report
description: Report a reproducible Codex Deck problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach Codex databases, rollout files, authentication data, or official SVG assets.
  - type: input
    id: codex-version
    attributes:
      label: Codex app version
      placeholder: 26.707.12708.0
    validations:
      required: true
  - type: input
    id: stream-deck
    attributes:
      label: Stream Deck version and hardware
      placeholder: 7.4.2.22730, Stream Deck MK.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the exact action and expected/actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Non-sensitive Stream Deck log excerpt
      render: text
